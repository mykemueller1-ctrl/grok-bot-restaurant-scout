<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>The New American Grill — ready after Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1b1a17;
        --panel: #f0ebe3;
        --steel: #3d4a55;
        --gold: #b08d57;
        --muted: #6b645a;
        --line: rgba(27, 26, 23, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "Manrope", system-ui, sans-serif;
        background:
          radial-gradient(900px 520px at 90% 0%, rgba(176, 141, 87, 0.22), transparent 55%),
          linear-gradient(165deg, #2b3036 0%, #1b1f24 40%, #12151a 100%);
      }
      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px 48px;
      }
      .door, .desk {
        width: min(520px, 100%);
        background: var(--panel);
        border: 1px solid rgba(240, 235, 227, 0.2);
        padding: 30px 26px 24px;
        animation: rise 650ms ease both;
      }
      .desk { display: none; width: min(720px, 100%); }
      .desk.on { display: block; }
      .door.off { display: none; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: none; }
      }
      .os {
        color: var(--steel);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      h1 {
        font-family: "Libre Baskerville", Georgia, serif;
        font-size: clamp(1.5rem, 3.5vw, 1.9rem);
        margin: 0 0 10px;
        line-height: 1.15;
      }
      .lede { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
      .field { margin-bottom: 12px; }
      label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
      select, input {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        padding: 12px;
        font: inherit;
      }
      .go {
        width: 100%;
        border: 0;
        margin-top: 8px;
        padding: 13px 14px;
        font: inherit;
        font-weight: 700;
        background: var(--steel);
        color: #fff;
        cursor: pointer;
      }
      .fine { margin: 12px 0 0; font-size: 12px; color: var(--muted); }
      .err { color: #8a2f1d; font-size: 13px; margin-top: 10px; min-height: 18px; }
      .banner {
        background: rgba(176, 141, 87, 0.18);
        border: 1px solid rgba(176, 141, 87, 0.35);
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 12px;
      }
      @media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        padding: 12px;
      }
      .stat b {
        display: block;
        font-family: "Libre Baskerville", Georgia, serif;
        font-size: 20px;
      }
      .stat span { font-size: 12px; color: var(--muted); }
      .signout {
        border: 1px solid var(--line);
        background: transparent;
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .mark {
        font-family: "Libre Baskerville", Georgia, serif;
        font-size: 22px;
      }
      .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="door" id="door">
        <div class="os">Secure ready · after Community</div>
        <h1>The New American Grill</h1>
        <p class="lede">
          Portal shell is ready. Kristen’s Courser packs are staged. When Community is made, we throw
          Kristen’s work into Grill the same way Community holds its book.
        </p>
        <form id="login">
          <div class="field">
            <label for="gate">House code</label>
            <input id="gate" type="password" placeholder="grill-kristen-ready" required />
          </div>
          <div class="field">
            <label for="seat">Draft seat</label>
            <select id="seat" required>
              <option value="">Choose a seat…</option>
            </select>
          </div>
          <button class="go" type="submit">Open staged desk</button>
          <div class="err" id="err"></div>
          <p class="fine">Not sold yet · Kristen packs staged · Community pattern next</p>
        </form>
      </section>
      <section class="desk" id="desk" aria-live="polite"></section>
    </main>
    <script src="../shared/isolation.js"></script>
    <script>
      const VENUE = "grill";
      let tenant = null;
      let seatsDoc = null;
      let packs = null;

      async function boot() {
        const bound = await Never86Portal.loadTenantBound(VENUE);
        tenant = bound.tenant;
        const [seats, kristen] = await Promise.all([
          fetch("./seats.json").then((r) => r.json()),
          fetch("./data/kristen-packs.json").then((r) => r.json()),
        ]);
        Never86Portal.assertOwnData(seats, VENUE, "seats");
        Never86Portal.assertOwnData(kristen, VENUE, "kristen-packs");
        seatsDoc = seats;
        packs = kristen;
        const select = document.getElementById("seat");
        for (const s of seats.seats) {
          const opt = document.createElement("option");
          opt.value = s.login_id;
          opt.textContent = `${s.label} · ${s.assignee.name} (${s.status})`;
          select.appendChild(opt);
        }
        const prior = Never86Portal.readSession(tenant.session_key);
        if (prior?.login_id) renderDesk(prior.login_id);
      }

      function renderDesk(loginId) {
        const active = seatsDoc.seats.find((s) => s.login_id === loginId);
        if (!active) return;
        document.getElementById("door").classList.add("off");
        const desk = document.getElementById("desk");
        desk.classList.add("on");
        desk.innerHTML = `
          <div class="top">
            <div>
              <div class="mark">The Grill</div>
              <div class="meta">Ready after Community · Kristen packs staged · ${packs.as_of}</div>
            </div>
            <button class="signout" type="button" id="signout">Sign out</button>
          </div>
          <div class="banner">
            ${packs.handoff}
          </div>
          <p style="margin:0 0 8px;font-size:14px"><strong>${active.label}</strong> · ${active.assignee.name} · ${active.status}</p>
          <div class="stats">
            <div class="stat"><b>${Never86Portal.money(packs.labor.net_sales, 2)}</b><span>Net sales (Kristen)</span></div>
            <div class="stat"><b>${packs.labor.labor_pct_net}%</b><span>Labor % net</span></div>
            <div class="stat"><b>${packs.labor.splh_net}</b><span>SPLH net</span></div>
          </div>
          <p class="fine" style="margin-top:14px">Source: ${packs.source_label}. Files: ${packs.courser_files.join(", ")}</p>
        `;
        document.getElementById("signout").onclick = () => {
          Never86Portal.clearSession(tenant.session_key);
          desk.classList.remove("on");
          desk.innerHTML = "";
          document.getElementById("door").classList.remove("off");
        };
      }

      document.getElementById("login").addEventListener("submit", (e) => {
        e.preventDefault();
        const code = document.getElementById("gate").value;
        const id = document.getElementById("seat").value;
        if (!Never86Portal.gateOk(tenant, code)) {
          document.getElementById("err").textContent = "Wrong house code for Grill.";
          return;
        }
        if (!id) {
          document.getElementById("err").textContent = "Pick a draft seat first.";
          return;
        }
        Never86Portal.saveSession(tenant.session_key, { venue_id: VENUE, login_id: id });
        renderDesk(id);
      });

      boot().catch((err) => {
        document.getElementById("err").textContent = String(err.message || err);
      });
    </script>
  </body>
</html>
