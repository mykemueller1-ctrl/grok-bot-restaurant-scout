name: Validate Never86 stack

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  pain-leads-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pain-leads-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/pain-leads-api/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: KEEP scorer smoke
        run: |
          node -e "
          import { scoreMarketplaceKeep } from './dist/lib/marketplaceKeepScore.js';
          import { dispatchSourceTool } from './dist/mcp/sources.js';
          const a = scoreMarketplaceKeep('Restaurant owners KEEP DoorDash 30% commission');
          if (a.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(a));
          const eff = scoreMarketplaceKeep('DoorDash commission is not your cost — statement: effective cost 18.75%; restaurant lives on what is left');
          if (!eff.signals.includes('effective_cost_math') || eff.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(eff));
          const toast = scoreMarketplaceKeep('Restaurant owners leaving Toast cite high fees lock-in — rent they do not KEEP');
          if (!toast.signals.includes('pos_fee_lockin') || toast.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(toast));
          const po = scoreMarketplaceKeep('BentoBox charges \$0.99 per order Online Order Service Fee — Clover POS required');
          if (!po.signals.includes('per_order_platform_fee') || !po.signals.includes('pos_fee_lockin')) throw new Error(JSON.stringify(po));
          const up = scoreMarketplaceKeep('UpMenu Basic overage \$1.90 per order after 75 orders — restaurant owners KEEP less');
          if (!up.signals.includes('per_order_platform_fee')) throw new Error(JSON.stringify(up));
          const fp = scoreMarketplaceKeep('Owner.com Flex \$249/month plus 5% restaurant fee per order — guests see 5% order support fee; restaurant owners KEEP less');
          if (!fp.signals.includes('first_party_pct_fee') || fp.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(fp));
          const ddoo = scoreMarketplaceKeep('DoorDash Online Ordering is 0% commission on direct orders — Marketplace still takes 25%; dual-run KEEP');
          if (!ddoo.signals.includes('marketplace_direct_zero')) throw new Error(JSON.stringify(ddoo));
          const uber = scoreMarketplaceKeep('Uber Webshop is commission-free; Grubhub Direct skips marketing commissions on branded sites');
          if (!uber.signals.includes('marketplace_direct_zero')) throw new Error(JSON.stringify(uber));
          const shop = scoreMarketplaceKeep('TikTok Shop US unified referral fee is 6% vs DoorDash Marketplace 25% — restaurant owners KEEP more on buy-now');
          if (!shop.signals.includes('social_shop_fee') || shop.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(shop));
          const b = await dispatchSourceTool('score_marketplace_keep', { snippet: 'Restaurant owner quitting DoorDash commission fees — rank by KEEP' });
          if (!b.ok || b.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(b));
          const g = await dispatchSourceTool('keep_channel_grade', { dinein: 12000, doordash: 9000, doordash_fee_pct: 25, social_buy_now: 2500 });
          if (!g.ok || g.summary?.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(g));
          console.log('KEEP scorer smoke ok', a.score, eff.score, toast.score, up.score, fp.score, ddoo.score, uber.score, shop.score, b.score, g.summary.marketplace_fee_total);
          "

  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/resolve-mcp-config.mjs
      - run: test -f stack/resolved-secrets.json
      - name: Codex Cloud wiring present
        run: |
          test -f AGENTS.md
          test -f docs/CODEX-CLOUD.md
          test -f scripts/codex-cloud-setup.sh
          test -f stack/github-secrets.manifest.json
          python3 -c "import json; m=json.load(open('stack/github-secrets.manifest.json')); assert m['codex_cloud_environment']['repo'].endswith('grok-bot-restaurant-scout')"
          python3 -c "import json; w=json.load(open('stack/wiring.json')); assert 'codex_cloud' in w and 'cloudflare' in w and 'tool_hunt' in w"

  swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 agent/pain-shoppers/build_swarm.py
      - run: test "$(python3 -c "import json; print(json.load(open('agent/pain-shoppers/family.json'))['agent_count'])")" = "238"

  codex-setup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash scripts/codex-cloud-setup.sh

  tool-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-tooling-ledger.mjs
      - run: node scripts/run-tool-hunt-week.mjs
      - name: Tool hunt docs + agent present
        run: |
          test -f docs/TOOL-HUNT.md
          test -f agent/tool-hunt/beyond-the-hunt.json
          test -f stack/tooling-ledger.json
          test -f routines/tool-hunt-weekly.json
          test -f scripts/run-tool-hunt-week.mjs
          test -f scripts/context-search.mjs
          test -f fixtures/tool-hunt/austin-love-brands.json
          test -f fixtures/tool-hunt/miami-love-brands.json
          test -f fixtures/tool-hunt/nashville-love-brands.json
          test -f fixtures/tool-hunt/denver-love-brands.json
          test -f fixtures/tool-hunt/pain-scan-marketplace-keep.json
          test -f fixtures/tool-hunt/pain-scan-doordash-effective-cost.json
          test -f fixtures/tool-hunt/pain-scan-menu-markup.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-girl-goat.json
          test -f fixtures/tool-hunt/pain-to-sales-effective-cost-franklin.json
          test -f fixtures/tool-hunt/pain-to-sales-miami-michaels-genuine.json
          test -f fixtures/tool-hunt/pain-to-sales-nashville-husk.json
          test -f fixtures/tool-hunt/pain-to-sales-denver-rioja.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-grader-rioja.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-grader-franklin.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-grader-husk.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-grader-michaels-genuine.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-grader-girl-goat.json
          test -f fixtures/tool-hunt/script-draft-franklin-buy-now.json
          test -f fixtures/tool-hunt/script-draft-husk-buy-now.json
          test -f fixtures/tool-hunt/script-draft-rioja-buy-now.json
          test -f fixtures/tool-hunt/script-draft-girl-goat-buy-now.json
          test -f fixtures/tool-hunt/script-draft-michaels-genuine-buy-now.json
          test -f scripts/mem0-import-tool-hunt-memory.mjs
          test -f scripts/mem0-smoke.mjs
          test -f scripts/score-marketplace-keep.mjs
          test -f scripts/score-pain-fixtures.mjs
          test -f scripts/validate-love-fixtures.mjs
          test -f scripts/validate-buy-now-dogfood.mjs
          test -f scripts/validate-market-coverage.mjs
          test -f scripts/keep-channel-grader.mjs
          test -f scripts/validate-keep-grader-dogfood.mjs
          test -f scripts/validate-social-shop-dogfood.mjs
          test -f scripts/tool-hunt-brief.mjs
          test -f scripts/unlock-beyond-the-hunt.mjs
          test -f fixtures/tool-hunt/catalog-sync-franklin-sandbox.json
          test -f fixtures/tool-hunt/catalog-sync-husk-sandbox.json
          test -f fixtures/tool-hunt/catalog-sync-rioja-sandbox.json
          test -f fixtures/tool-hunt/catalog-sync-girl-goat-sandbox.json
          test -f fixtures/tool-hunt/catalog-sync-michaels-genuine-sandbox.json
          test -f fixtures/tool-hunt/pain-scan-dual-run.json
          test -f fixtures/tool-hunt/pain-scan-bentobox-per-order.json
          test -f fixtures/tool-hunt/pain-scan-owner-pct-fee.json
          test -f fixtures/tool-hunt/pain-scan-upmenu-overage.json
          test -f fixtures/tool-hunt/pain-scan-doordash-online-ordering.json
          test -f fixtures/tool-hunt/pain-scan-uber-grubhub-direct.json
          test -f fixtures/tool-hunt/pain-scan-tiktok-shop-fee.json
          test -f fixtures/tool-hunt/pain-scan-otter-per-order.json
          test -f fixtures/tool-hunt/pain-to-sales-social-shop-franklin.json
          test -f fixtures/tool-hunt/pain-to-sales-social-shop-girl-goat.json
          test -f fixtures/tool-hunt/pain-to-sales-social-shop-husk.json
          test -f fixtures/tool-hunt/pain-to-sales-social-shop-michaels-genuine.json
          test -f fixtures/tool-hunt/pain-to-sales-social-shop-rioja.json
          test -f fixtures/tool-hunt/keep-channel-grader-pilot.json
          test -f skills/keep-channel-grader.md
          test -f stack/tool-hunt-briefs/2026-09-04.md
          node scripts/score-marketplace-keep.mjs "KEEP DoorDash commission quit" | grep -q anti_marketplace_buy_now
          node scripts/score-marketplace-keep.mjs "DoorDash commission is not your cost — statement effective cost 18.75% restaurant lives on what is left" | grep -q effective_cost_math
          node scripts/score-marketplace-keep.mjs "Restaurant owners leaving Toast cite high fees lock-in — rent they do not KEEP" | grep -q pos_fee_lockin
          node scripts/score-marketplace-keep.mjs "pad DoorDash menus 20% menu markup to offset commissions" | grep -q menu_markup_pain
          node scripts/score-marketplace-keep.mjs "Own your ordering commission-free KEEP more profit" | grep -q own_ordering_keep
          node scripts/score-marketplace-keep.mjs "dual-run DoorDash for discovery and own your ordering to KEEP" | grep -q dual_run_marketplace
          node scripts/score-marketplace-keep.mjs 'BentoBox charges $0.99 per order Online Order Service Fee — Clover POS required' | grep -q per_order_platform_fee
          node scripts/score-marketplace-keep.mjs 'UpMenu Basic overage $1.90 per order after 75 orders — KEEP leak' | grep -q per_order_platform_fee
          node scripts/score-marketplace-keep.mjs 'Owner.com Flex $249/month plus 5% restaurant fee per order — guests see 5% order support fee' | grep -q first_party_pct_fee
          node scripts/score-marketplace-keep.mjs 'DoorDash Online Ordering is 0% commission on direct orders — Marketplace still 25%' | grep -q marketplace_direct_zero
          node scripts/score-marketplace-keep.mjs 'Uber Webshop is commission-free on direct orders — Grubhub Direct skips marketing commissions' | grep -q marketplace_direct_zero
          node scripts/score-marketplace-keep.mjs 'TikTok Shop US unified referral fee is 6% vs DoorDash Marketplace 25%' | grep -q social_shop_fee
          node scripts/keep-channel-grader.mjs --dinein 12000 --doordash 9000 --doordash_fee_pct 25 --social_buy_now 2500 | grep -q anti_marketplace_buy_now
          node scripts/validate-keep-grader-dogfood.mjs | grep -q '"keep_grader_dogfoods": 5'
          node scripts/score-pain-fixtures.mjs | grep -q '"strong_keep": 17'
          node scripts/validate-love-fixtures.mjs | grep -q '"markets": 5'
          node scripts/validate-buy-now-dogfood.mjs | grep -q '"script_drafts": 5'
          node scripts/validate-market-coverage.mjs | grep -q '"markets": 5'
          node scripts/validate-social-shop-dogfood.mjs | grep -q '"social_shop_dogfoods": 5'
          node scripts/tool-hunt-brief.mjs | grep -q 'Beyond the Hunt'
          # unlock exits 2 while blocked, 0 when READY — bash -e must not abort on 2
          if node scripts/unlock-beyond-the-hunt.mjs; then
            echo "unlock READY"
          else
            ec=$?
            test "$ec" -eq 2
          fi
