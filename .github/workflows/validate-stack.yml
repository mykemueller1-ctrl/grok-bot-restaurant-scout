name: Validate Never86 stack

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  pain-leads-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pain-leads-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/pain-leads-api/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: KEEP scorer smoke
        run: |
          node -e "
          import { scoreMarketplaceKeep } from './dist/lib/marketplaceKeepScore.js';
          import { dispatchSourceTool } from './dist/mcp/sources.js';
          const a = scoreMarketplaceKeep('Restaurant owners KEEP DoorDash 30% commission');
          if (a.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(a));
          const eff = scoreMarketplaceKeep('DoorDash commission is not your cost — statement: effective cost 18.75%; restaurant lives on what is left');
          if (!eff.signals.includes('effective_cost_math') || eff.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(eff));
          const toast = scoreMarketplaceKeep('Restaurant owners leaving Toast cite high fees lock-in — rent they do not KEEP');
          if (!toast.signals.includes('pos_fee_lockin') || toast.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(toast));
          const po = scoreMarketplaceKeep('BentoBox charges \$0.99 per order Online Order Service Fee — Clover POS required');
          if (!po.signals.includes('per_order_platform_fee') || !po.signals.includes('pos_fee_lockin')) throw new Error(JSON.stringify(po));
          const up = scoreMarketplaceKeep('UpMenu Basic overage \$1.90 per order after 75 orders — restaurant owners KEEP less');
          if (!up.signals.includes('per_order_platform_fee')) throw new Error(JSON.stringify(up));
          const fp = scoreMarketplaceKeep('Owner.com Flex \$249/month plus 5% restaurant fee per order — guests see 5% order support fee; restaurant owners KEEP less');
          if (!fp.signals.includes('first_party_pct_fee') || fp.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(fp));
          const flip = scoreMarketplaceKeep('Flipdish charges 2-7% per-order commission on direct online orders vs DoorDash Marketplace 25%');
          if (!flip.signals.includes('first_party_pct_fee') || flip.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(flip));
          const ddoo = scoreMarketplaceKeep('DoorDash Online Ordering is 0% commission on direct orders — Marketplace still takes 25%; dual-run KEEP');
          if (!ddoo.signals.includes('marketplace_direct_zero')) throw new Error(JSON.stringify(ddoo));
          const uber = scoreMarketplaceKeep('Uber Webshop is commission-free; Grubhub Direct skips marketing commissions on branded sites');
          if (!uber.signals.includes('marketplace_direct_zero')) throw new Error(JSON.stringify(uber));
          const shop = scoreMarketplaceKeep('TikTok Shop US unified referral fee is 6% vs DoorDash Marketplace 25% — restaurant owners KEEP more on buy-now');
          if (!shop.signals.includes('social_shop_fee') || shop.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(shop));
          const guest = scoreMarketplaceKeep('DevourNow customers pay \$2.99 per order tech fee under 0% commission — restaurant owners KEEP less conversion vs DoorDash 25%');
          if (!guest.signals.includes('guest_paid_platform_fee') || !guest.signals.includes('per_order_platform_fee') || guest.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(guest));
          const b = await dispatchSourceTool('score_marketplace_keep', { snippet: 'Restaurant owner quitting DoorDash commission fees — rank by KEEP' });
          if (!b.ok || b.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(b));
          const g = await dispatchSourceTool('keep_channel_grade', { dinein: 12000, doordash: 9000, doordash_fee_pct: 25, social_buy_now: 2500 });
          if (!g.ok || g.summary?.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(g));
          console.log('KEEP scorer smoke ok', a.score, eff.score, toast.score, up.score, fp.score, ddoo.score, uber.score, shop.score, guest.score, b.score, g.summary.marketplace_fee_total);
          "

  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/resolve-mcp-config.mjs
      - run: test -f stack/resolved-secrets.json
      - name: Codex Cloud wiring present
        run: |
          test -f AGENTS.md
          test -f docs/CODEX-CLOUD.md
          test -f scripts/codex-cloud-setup.sh
          test -f stack/github-secrets.manifest.json
          python3 -c "import json; m=json.load(open('stack/github-secrets.manifest.json')); assert m['codex_cloud_environment']['repo'].endswith('grok-bot-restaurant-scout')"
          python3 -c "import json; w=json.load(open('stack/wiring.json')); assert 'codex_cloud' in w and 'cloudflare' in w and 'tool_hunt' in w"

  swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 agent/pain-shoppers/build_swarm.py
      - run: test "$(python3 -c "import json; print(json.load(open('agent/pain-shoppers/family.json'))['agent_count'])")" = "238"

  codex-setup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash scripts/codex-cloud-setup.sh

  tool-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-tooling-ledger.mjs
      - run: node scripts/run-tool-hunt-week.mjs
      - name: Tool hunt docs + agent present
