name: Validate Never86 stack

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  pain-leads-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pain-leads-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/pain-leads-api/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: KEEP scorer smoke
        run: |
          node -e "
          import { scoreMarketplaceKeep } from './dist/lib/marketplaceKeepScore.js';
          import { dispatchSourceTool } from './dist/mcp/sources.js';
          const a = scoreMarketplaceKeep('Restaurant owners KEEP DoorDash 30% commission');
          if (a.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(a));
          const eff = scoreMarketplaceKeep('DoorDash commission is not your cost — statement: effective cost 18.75%; restaurant lives on what is left');
          if (!eff.signals.includes('effective_cost_math') || eff.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(eff));
          const toast = scoreMarketplaceKeep('Restaurant owners leaving Toast cite high fees lock-in — rent they do not KEEP');
          if (!toast.signals.includes('pos_fee_lockin') || toast.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(toast));
          const b = await dispatchSourceTool('score_marketplace_keep', { snippet: 'Restaurant owner quitting DoorDash commission fees — rank by KEEP' });
          if (!b.ok || b.never86_wedge !== 'anti_marketplace_buy_now') throw new Error(JSON.stringify(b));
          console.log('KEEP scorer smoke ok', a.score, eff.score, toast.score, b.score);
          "

  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/resolve-mcp-config.mjs
      - run: test -f stack/resolved-secrets.json
      - name: Codex Cloud wiring present
        run: |
          test -f AGENTS.md
          test -f docs/CODEX-CLOUD.md
          test -f scripts/codex-cloud-setup.sh
          test -f stack/github-secrets.manifest.json
          python3 -c "import json; m=json.load(open('stack/github-secrets.manifest.json')); assert m['codex_cloud_environment']['repo'].endswith('grok-bot-restaurant-scout')"
          python3 -c "import json; w=json.load(open('stack/wiring.json')); assert 'codex_cloud' in w and 'cloudflare' in w and 'tool_hunt' in w"

  swarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 agent/pain-shoppers/build_swarm.py
      - run: test "$(python3 -c "import json; print(json.load(open('agent/pain-shoppers/family.json'))['agent_count'])")" = "238"

  codex-setup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash scripts/codex-cloud-setup.sh

  tool-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-tooling-ledger.mjs
      - run: node scripts/run-tool-hunt-week.mjs
      - name: Tool hunt docs + agent present
        run: |
          test -f docs/TOOL-HUNT.md
          test -f agent/tool-hunt/beyond-the-hunt.json
          test -f stack/tooling-ledger.json
          test -f routines/tool-hunt-weekly.json
          test -f scripts/run-tool-hunt-week.mjs
          test -f scripts/context-search.mjs
          test -f fixtures/tool-hunt/austin-love-brands.json
          test -f fixtures/tool-hunt/miami-love-brands.json
          test -f fixtures/tool-hunt/pain-scan-marketplace-keep.json
          test -f fixtures/tool-hunt/pain-scan-doordash-effective-cost.json
          test -f fixtures/tool-hunt/pain-to-sales-keep-girl-goat.json
          test -f fixtures/tool-hunt/pain-to-sales-effective-cost-franklin.json
          test -f fixtures/tool-hunt/pain-to-sales-miami-michaels-genuine.json
          test -f fixtures/tool-hunt/script-draft-franklin-buy-now.json
          test -f scripts/mem0-import-tool-hunt-memory.mjs
          test -f scripts/mem0-smoke.mjs
          test -f scripts/score-marketplace-keep.mjs
          test -f scripts/score-pain-fixtures.mjs
          test -f scripts/validate-love-fixtures.mjs
          test -f scripts/tool-hunt-brief.mjs
          test -f scripts/unlock-beyond-the-hunt.mjs
          test -f fixtures/tool-hunt/catalog-sync-franklin-sandbox.json
          test -f stack/tool-hunt-briefs/2026-09-04.md
          node scripts/score-marketplace-keep.mjs "KEEP DoorDash commission quit" | grep -q anti_marketplace_buy_now
          node scripts/score-marketplace-keep.mjs "DoorDash commission is not your cost — statement effective cost 18.75% restaurant lives on what is left" | grep -q effective_cost_math
          node scripts/score-marketplace-keep.mjs "Restaurant owners leaving Toast cite high fees lock-in — rent they do not KEEP" | grep -q pos_fee_lockin
          node scripts/score-pain-fixtures.mjs | grep -q '"strong_keep": 7'
          node scripts/validate-love-fixtures.mjs | grep -q '"markets": 3'
          node scripts/tool-hunt-brief.mjs | grep -q 'Beyond the Hunt'
          # unlock exits 2 while blocked, 0 when READY — bash -e must not abort on 2
          if node scripts/unlock-beyond-the-hunt.mjs; then
            echo "unlock READY"
          else
            ec=$?
            test "$ec" -eq 2
          fi
